name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: copymint_test
          POSTGRES_USER: copymint_admin
          POSTGRES_PASSWORD: copymint_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copymint_admin -d copymint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.6
          python-version: 3.13.13
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Migration smoke test
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://copymint_admin:copymint_test_only@localhost:5432/copymint_test
        run: uv run alembic upgrade head

      - name: Provision non-superuser test role
        env:
          PGPASSWORD: copymint_test_only
        run: |
          psql -h localhost -U copymint_admin -d copymint_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE copymint_app LOGIN PASSWORD 'copymint_app_test_only' NOSUPERUSER;
          CREATE ROLE copymint_signer LOGIN PASSWORD 'copymint_signer_test_only' NOSUPERUSER;
          GRANT CONNECT ON DATABASE copymint_test TO copymint_app;
          GRANT USAGE ON SCHEMA public TO copymint_app;
          GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE ON ALL TABLES IN SCHEMA public TO copymint_app;
          SQL
          createdb -h localhost -U copymint_admin -O copymint_admin copymint_signer_test

      - name: Signer migration and credential isolation
        env:
          APP_ENV: test
          PGPASSWORD: copymint_test_only
          SIGNER_DATABASE_URL: postgresql+psycopg://copymint_admin:copymint_test_only@localhost:5432/copymint_signer_test
          SIGNER_AUTH_SECRET: ssssssssssssssssssssssssssssssss
          AWS_REGION: eu-west-1
          AWS_KMS_KEY_ARN: arn:aws:kms:eu-west-1:000000000000:key/test
        run: |
          uv run alembic -c signer_alembic.ini upgrade head
          psql -h localhost -U copymint_admin -d copymint_signer_test -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE CONNECT ON DATABASE copymint_signer_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE copymint_signer_test TO copymint_signer;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO copymint_signer;
          GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE ON ALL TABLES IN SCHEMA public TO copymint_signer;
          SQL

      - name: Test
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://copymint_app:copymint_app_test_only@localhost:5432/copymint_test
          SIGNER_DATABASE_URL: postgresql+psycopg://copymint_signer:copymint_signer_test_only@localhost:5432/copymint_signer_test
          RUN_DATABASE_TESTS: "1"
        run: uv run pytest

      - name: Scan repository for secrets
        run: uv run python scripts/secret_scan.py

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Build production container
        run: docker build --tag copymint-ci:${{ github.sha }} .
