services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: copymint
      POSTGRES_USER: copymint
      POSTGRES_PASSWORD: copymint_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copymint -d copymint"]
      interval: 5s
      timeout: 5s
      retries: 10

  signer-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: copymint_signer
      POSTGRES_USER: copymint_signer
      POSTGRES_PASSWORD: signer_local_only
    ports:
      - "5433:5432"
    volumes:
      - signer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copymint_signer -d copymint_signer"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  signer-postgres-data:
  queue-data:
